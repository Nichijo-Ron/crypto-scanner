name: scan

on:
  schedule:
    # รันทุกชั่วโมงที่นาทีที่ 5 (เวลา UTC) หลังแท่ง 1h ปิดแล้ว · GitHub อาจเริ่มช้ากว่านี้ได้บ้างเมื่อระบบโหลดสูง
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      send_test:
        description: "ส่งข้อความทดสอบเข้า Telegram ก่อนสแกน"
        type: boolean
        default: false
      force_all:
        description: "ส่งรายการเหรียญที่เข้าเงื่อนไขตอนนี้ทั้งหมด (ไม่สนว่าเคยแจ้งแล้ว)"
        type: boolean
        default: false

# ต้องมีสิทธิ์เขียน เพื่อบันทึกไฟล์ state.json (ใช้จำว่าแจ้งเหรียญอะไรไปแล้ว)
permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_TEST: ${{ inputs.send_test && '1' || '0' }}
          FORCE_ALL: ${{ inputs.force_all && '1' || '0' }}
        run: node scan.mjs

      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # กัน GitHub ปิดงานตั้งเวลาอัตโนมัติหลังไม่มีกิจกรรม 60 วัน: ถ้า commit ล่าสุดเก่ากว่า 40 วัน ให้บันทึกไฟล์เล็กๆ 1 ครั้ง
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt 3456000 ]; then
            date -u +"%Y-%m-%dT%H:%MZ" > .keepalive
            git add .keepalive
          fi
          if [ -n "$(git status --porcelain state.json)" ]; then git add state.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "chore: update scan state"
            git pull --rebase
            git push
          fi
